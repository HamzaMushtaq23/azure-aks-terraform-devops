trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

- stage: TerraformPlan
  displayName: Terraform Plan

  jobs:

  - job: Plan
    displayName: Terraform Plan

    steps:

    # Checkout repository
    - checkout: self
      displayName: Checkout Repository

    # Install Terraform
    - bash: |
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common

        wget -O- https://apt.releases.hashicorp.com/gpg | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
          https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list

        sudo apt-get update
        sudo apt-get install -y terraform

        echo "Terraform version:"
        terraform version

      displayName: Install Terraform

    # Azure authentication + Terraform
    - task: AzureCLI@2
      displayName: Terraform Init Validate Plan
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

        inlineScript: |

          echo "======================================"
          echo "Azure Account"
          echo "======================================"

          az account show \
            --query "{subscriptionId:id, tenantId:tenantId}" \
            -o table

          echo ""
          echo "Getting Azure Subscription ID..."

          SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          export TF_VAR_subscription_id="$SUBSCRIPTION_ID"

          echo "Subscription ID configured for Terraform."

          echo ""
          echo "======================================"
          echo "Terraform Version"
          echo "======================================"

          terraform version

          echo ""
          echo "======================================"
          echo "Terraform Init"
          echo "======================================"

          terraform init -reconfigure

          echo ""
          echo "======================================"
          echo "Terraform Format Check"
          echo "======================================"

          terraform fmt -check

          echo ""
          echo "======================================"
          echo "Terraform Validate"
          echo "======================================"

          terraform validate

          echo ""
          echo "======================================"
          echo "Terraform Plan"
          echo "======================================"

          terraform plan \
            -out="$(Pipeline.Workspace)/tfplan"

          echo ""
          echo "======================================"
          echo "Checking Terraform Plan File"
          echo "======================================"

          ls -lah "$(Pipeline.Workspace)"

          if [ ! -f "$(Pipeline.Workspace)/tfplan" ]; then
            echo "ERROR: Terraform plan file was not created."
            exit 1
          fi

          echo "Terraform plan file created successfully."

    # Publish Terraform plan
    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Plan
      inputs:
        targetPath: '$(Pipeline.Workspace)/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'