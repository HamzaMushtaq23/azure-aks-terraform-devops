apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azure-aks-app
  template:
    metadata:
      labels:
        app: azure-aks-app
    spec:
      containers:
        - name: azure-aks-app
          image: azureaksacr01.azurecr.io/azure-aks-app:latest
          ports:
            - containerPort: 80